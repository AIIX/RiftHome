#
# The repository's labels. The issue forms and the workflows use these names; they are created over GitHub's API
# when the repository is set up.

- name: "bug"
  color: "d73a4a"
  description: "A reproducible defect"
- name: "enhancement"
  color: "a2eeef"
  description: "A feature request or improvement"
- name: "documentation"
  color: "0075ca"
  description: "README, guides or comments"
- name: "question"
  color: "d876e3"
  description: "A usage question (Discussions is the better place)"
- name: "needs-triage"
  color: "fbca04"
  description: "Waiting for the maintainer"
- name: "needs-info"
  color: "e99695"
  description: "Missing the version, the log or the steps to reproduce"
- name: "windows"
  color: "5319e7"
  description: "Windows and layout: placing, moving, scaling, Home, dock"
- name: "controllers"
  color: "1d76db"
  description: "Controllers and input: pointing, buttons, keyboard, game mode"
- name: "apps"
  color: "0e8a16"
  description: "Firefox, Chromium, Steam, Flatpak and other apps in Rift Home"
- name: "hdr"
  color: "b60205"
  description: "HDR and colour"
- name: "settings"
  color: "bfd4f2"
  description: "The Settings app"
- name: "session"
  color: "f9d0c4"
  description: "The login screen session and starting Rift Home"
- name: "packaging"
  color: "c5def5"
  description: "Packages, install and first run"
- name: "upstream"
  color: "cfd3d7"
  description: "A problem in RiftLinux, an app, a graphics driver or a library, not in Rift Home"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already reported"
