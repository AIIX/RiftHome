<!-- Rift Home test page: a focused text field; what arrives is put into the title, which Rift Home logs. -->
<html><head><meta charset="utf-8"><title>typing test: nothing yet</title>
<style>html,body{margin:0;height:100%}input{width:100%;height:100%;font-size:64px;box-sizing:border-box}</style></head>
<body><input id="t" autofocus placeholder="type here">
<script>
const t = document.getElementById('t');
t.addEventListener('input', () => { document.title = 'typed: ' + t.value; });
t.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.title = 'typed: ' + t.value + ' [Enter]'; });
</script></body></html>
